sentence=High-performance embedded C++ libraries for ESP32, STM32 and other MCUs: lightweight i18n framework for embedded UIs.
paragraph=Embedded C++17 internationalization: register language string tables keyed by enum ID, switch languages at runtime, query per-language font Y-offset for baseline correction. Bundled CJK, Spanish and Vietnamese fonts at 14/20/28 px. Pure C++17, no platform bindings. Supported targets: ESP32, STM32 and other MCUs.
